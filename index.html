  el.innerHTML = `<div class="ob-in">${top}${body}<div class="ob-actions">
    ${step < 3 ? `<button class="btn primary block" data-act="ob-next" ${canNext ? '' : 'disabled'} style="min-height:52px">${t('ob.next')}</button>` : `<button class="btn primary block" data-act="ob-finish" style="min-height:52px">${t('ob.start')}</button>`}</div></div>`;
  const h = $('#obTitle'); if (h) h.setAttribute('tabindex', '-1');
}
function readObInputs(){
  const d = ob.d, g = id => { const e = $('#' + id); return e ? parseFloat(e.value) : NaN; };
  const age = g('ob-age'), w = g('ob-weight'), h = g('ob-height'), ft = g('ob-ft'), inch = g('ob-in');
  if (age >= 13 && age <= 100) d.age = Math.round(age);
  if (w > 0){ const kg = wIn(w); if (kg >= 25 && kg <= 250) d.weight = r1(kg); }
  if (h >= 100 && h <= 230) d.height = Math.round(h);
  if (ft >= 3){ const cm = (ft * 12 + (inch || 0)) * 2.54; if (cm >= 100 && cm <= 230) d.height = Math.round(cm); }
}

/* =========================================================
   BACKUP
   ========================================================= */
const backupText = () => JSON.stringify(state, null, 2);
function restoreFrom(text){
  try {
    const p = JSON.parse(text);
    if (!p || !p.profile || !p.logs) throw new Error('shape');
    state = normalizeState(p); state.sample = false; state.onboarded = true; LANG = state.settings.lang; reindex(); save();
    renderShell(); snack(t('me.restored')); setView('today');
  } catch (e) { snack(t('me.bad')); }
}
function markBackup(){ state.lastBackup = localDate(); persistQuiet(); if (view === 'me') renderMe(); }

/* =========================================================
   SWIPE TO DELETE (Today rows) — the edit sheet's Remove button is the non-gesture alternative
   ========================================================= */
let sw = null;
document.addEventListener('pointerdown', e => {
  const it = e.target.closest('.item'); if (!it || e.pointerType === 'mouse') return;
  sw = {el:it, x:e.clientX, y:e.clientY, dx:0, active:false};
});
document.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.active){ if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; } if (dx < -10) { sw.active = true; sw.el.classList.add('dragging'); } else return; }
  sw.dx = Math.min(0, dx); sw.el.style.transform = `translateX(${sw.dx}px)`;
});
document.addEventListener('pointerup', () => {
  if (!sw) return; const s = sw; sw = null;
  if (!s.active) return;
  s.el.classList.remove('dragging');
  s.suppress = true; suppressClick = true; setTimeout(() => { suppressClick = false; }, 300);
  if (s.dx < -90){ s.el.style.transform = 'translateX(-100%)'; setTimeout(() => removeEntry(s.el.dataset.slot, s.el.dataset.id), 150); }
  else s.el.style.transform = '';
});
document.addEventListener('pointercancel', () => { if (sw){ sw.el.style.transform = ''; sw.el.classList.remove('dragging'); sw = null; } });
let suppressClick = false;

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', ev => {
  if (suppressClick){ suppressClick = false; ev.preventDefault(); return; }
  const tb = ev.target.closest('[data-theme-set]');
  if (tb){ applyTheme(tb.dataset.themeSet, true); openThemeMenu(false); $('#themeBtn').focus(); return; }
  if (!ev.target.closest('.theme-wrap') && !$('#themeMenu').hidden) openThemeMenu(false);
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a){
    case 'nav': setView(b.dataset.view); break;
    case 'quick-log': openSheet('quick', {slot:slotByTime()}); break;
    case 'week': { const d = shiftDate(selectedDate, Number(b.dataset.d)); setDate(d > localDate() ? localDate() : d); break; }
    case 'pick-date': setDate(b.dataset.date); if (b.dataset.go) setView(b.dataset.go); break;
    case 'water': addWater(Number(b.dataset.d)); break;
    case 'water-add': addWater(1); break;
    case 'weight': openSheet('weight'); break;
    case 'add-slot': openSearch(b.dataset.slot); break;
    case 'edit': { const e = getDay(selectedDate).meals[b.dataset.slot].find(x => x.id === b.dataset.id); if (e) openFood(null, e, b.dataset.slot); break; }
    case 'same-yesterday': {
      const k = b.dataset.slot, src = getDay(shiftDate(selectedDate, -1)).meals[k].filter(e => findFood(e.foodId));
      logFoods(src.map(e => ({food:findFood(e.foodId), qty:e.servings})), k); render(); break;
    }
    case 'log-usual': {
      const list = b.dataset.ids.split(',').map(s => { const [id, q] = s.split(':'); return {food:findFood(id), qty:Number(q) || 1}; }).filter(x => x.food);
      if (dlg.open) closeSheet();
      logFoods(list, b.dataset.slot); render(); break;
    }
    case 'quick-add': {
      const f = findFood(b.dataset.id); if (!f) break;
      const slot = b.dataset.slot || slotByTime();
      if (b.classList.contains('add-btn')){ b.classList.add('ok'); b.innerHTML = ic('check'); setTimeout(() => { b.classList.remove('ok'); b.innerHTML = ic('plus'); }, 1400); }
      const inSearch = sheet && sheet.kind === 'search';
      const inQuick = sheet && sheet.kind === 'quick';
      if (inSearch){ sheet.browser.added++; }
      if (inQuick) closeSheet();
      logFoods([{food:f, qty:1}], slot);
      if (inSearch) refreshSheet(); else if (!inQuick && view === 'foods') { renderHeader(); } else if (!inQuick) render();
      break;
    }
    case 'open-food': { const f = findFood(b.dataset.id); if (f) openFood(f, null, browserCtx(b) ? browserCtx(b).slot : null); break; }
    case 'br-slot': { const c = browserCtx(b); c.slot = b.dataset.slot; $$('[data-act="br-slot"]', b.parentNode).forEach(x => x.setAttribute('aria-pressed', String(x === b))); if (c.scope === 'sheet'){ const h = $('h2', dlg); if (h) h.textContent = t('meal.add', {slot:slotName(c.slot)}); } renderBrowserResults(browserRoot(b), c); break; }
    case 'br-tab': { const c = browserCtx(b), root = browserRoot(b); c.tab = b.dataset.tab; c.q = ''; c.limit = 40; const q = $('.br-q', root); if (q) q.value = ''; renderBrowserResults(root, c); break; }
    case 'br-filter': { const c = browserCtx(b); c.filter = b.dataset.f; c.limit = 40; renderBrowserResults(browserRoot(b), c); break; }
    case 'br-more': { const c = browserCtx(b); c.limit += 40; renderBrowserResults(browserRoot(b), c); break; }
    case 'describe': { const q = b.dataset.q || '', slot = (sheet && sheet.browser && sheet.browser.slot) || pageBrowser.slot || slotByTime(); openSheet('quick', {slot, text:q}); break; }
    case 'create-dish': { const slot = sheet ? (sheet.slot || (sheet.browser && sheet.browser.slot)) : pageBrowser.slot; openSheet('custom', {prefill:b.dataset.q || '', slot}); break; }
    case 'del-custom': {
      const f = findFood(b.dataset.id); if (!f) break;
      const idx = state.customFoods.findIndex(x => x.id === f.id);
      state.customFoods.splice(idx, 1); state.favourites = state.favourites.filter(id => id !== f.id); reindex(); save(); closeSheet();
      snack(t('cd.deleted'), {label:t('undo'), fn:() => { state.customFoods.splice(idx, 0, f); reindex(); save(); render(); }});
      break;
    }
    case 'toggle-fav': {
      const id = b.dataset.id, on = state.favourites.includes(id);
      state.favourites = on ? state.favourites.filter(x => x !== id) : [id, ...state.favourites];
      save(); renderSheet(); snack(t(on ? 'fs.favRemoved' : 'fs.favAdded')); break;
    }
    case 'close': closeSheet(); break;
    case 'sheet-back': { const back = sheet.back; sheet = back; renderSheet(); break; }
    case 'qty-mode': sheet.mode = b.dataset.m; renderFoodSheet(); break;
    case 'qty-step': {
      const gr = sheet.src.grams, step = sheet.mode === 'g' ? 25 / gr : 0.5;
      sheet.qty = clamp(Math.round((sheet.qty + Number(b.dataset.d) * step) * 100) / 100, sheet.mode === 'g' ? 5 / gr : 0.25, 50);
      updateFoodSheet(true); break;
    }
    case 'qty-set': sheet.qty = Number(b.dataset.q); updateFoodSheet(true); break;
    case 'sheet-slot': sheet.slot = b.dataset.slot; $$('[data-act="sheet-slot"]', dlg).forEach(x => x.setAttribute('aria-pressed', String(x === b))); { const c = $('[data-act="sheet-confirm"]', dlg); if (c && !sheet.entry) c.textContent = t('fs.log', {slot:slotName(sheet.slot)}); } break;
    case 'sheet-confirm': confirmFood(); break;
    case 'sheet-remove': { const {entry} = sheet, k = SLOTS.find(s => getDay(selectedDate).meals[s].some(e => e.id === entry.id)); closeSheet(); if (k) removeEntry(k, entry.id); break; }
    case 'confirm-ok': { const fn = sheet && sheet.onOk; closeSheet(); fn && setTimeout(fn, 60); break; }
    case 'snack-act': { const fn = snackFn; hideSnack(); fn && fn(); break; }
    case 'q-slot': sheet.slot = b.dataset.slot; sheet.slotManual = true; $$('[data-act="q-slot"]', dlg).forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderQuickResults(); break;
    case 'q-qty': { const it = sheet.parsed.items[+b.dataset.i]; it.qty = clamp(it.qty + Number(b.dataset.d), 0.25, 20); renderQuickResults(); break; }
    case 'q-del': sheet.parsed.items.splice(+b.dataset.i, 1); renderQuickResults(); break;
    case 'q-swap': case 'q-search': {
      const q = a === 'q-swap' ? sheet.parsed.items[+b.dataset.i].text : b.dataset.q, slot = sheet.slot;
      if (a === 'q-swap') sheet.parsed.items.splice(+b.dataset.i, 1);
      sheet = {kind:'search', browser:{scope:'sheet', tab:'suggested', q, filter:'all', limit:40, slot, added:0}}; renderSheet(); break;
    }
    case 'q-log': { const {items} = sheet.parsed, slot = sheet.slot; if (!items.length) break; closeSheet(); logFoods(items.map(it => ({food:it.food, qty:it.qty})), slot); break; }
    case 'voice': startVoice(b); break;
    case 'mute-insight': { state.muted[b.dataset.id] = shiftDate(localDate(), 14); save(); render(); snack(t('in.muted')); break; }
    case 'insight-protein': openSheet('search', {browser:{scope:'sheet', tab:'all', q:'', filter:'high-protein', limit:40, slot:slotByTime(), added:0}}); break;
    case 'insight-guava': { const f = findFood('fr_05'); if (f) openFood(f, null, slotByTime()); break; }
    case 'dismiss': state.dismissed[b.dataset.k] = true; if (b.dataset.k === 'whatsNewPending') delete state.dismissed.whatsNewPending; save(); render(); break;
    case 'whats-new': delete state.dismissed.whatsNewPending; save(); setView('me'); setTimeout(() => { const el = $('#dietPref'); if (el) el.scrollIntoView({block:'center'}); }, 80); break;
    case 'clear-sample': {
      const snap = JSON.stringify(state);
      state.logs = {}; state.weights = {}; state.sample = false; save(); render();
      snack(t('sample.cleared'), {label:t('undo'), fn:() => { state = normalizeState(JSON.parse(snap)); reindex(); save(); render(); }});
      if (!state.onboarded) setTimeout(startOnboarding, 400);
      break;
    }
    case 'start-onboarding': startOnboarding(); break;
    case 'trends-mode': trendsMode = b.dataset.m; renderTrends(); break;
    case 'recalc': {
      const before = {...state.profile}; state.profile = readGoalsForm(); Object.assign(state.profile, suggestTargets(state.profile)); save(); renderMe();
      snack(t('me.recalced'), {label:t('undo'), fn:() => { state.profile = before; save(); renderMe(); }}); break;
    }
    case 'fix-carbs': {
      const P = state.profile = readGoalsForm(); P.goalCarbs = Math.max(0, Math.round((P.goalCalories - P.goalProtein * 4 - P.goalFat * 9) / 4)); save(); renderMe(); flashSaved(); break;
    }
    case 'set-theme': applyTheme(b.dataset.v, true); renderMe(); break;
    case 'set-lang': state.settings.lang = LANG = b.dataset.v; save(); renderShell(); render(); break;
    case 'set-units': state.settings.units = b.dataset.v; save(); render(); break;
    case 'set-diet': state.settings.diet = b.dataset.v; save(); renderMe(); break;
    case 'set-haptics': state.settings.haptics = b.dataset.v === 'true'; save(); renderMe(); break;
    case 'toggle-region': { const r = b.dataset.v, R = state.settings.regions; state.settings.regions = R.includes(r) ? R.filter(x => x !== r) : [...R, r]; save(); b.setAttribute('aria-pressed', String(state.settings.regions.includes(r))); break; }
    case 'copy-backup': {
      const text = backupText();
      const fallback = () => { const det = $('details.adv'); if (det) det.open = true; const ta = $('#restoreText'); ta.value = text; ta.focus(); ta.select(); snack(t('me.selected')); markBackup(); };
      try { navigator.clipboard.writeText(text).then(() => { snack(t('me.copied')); markBackup(); }, fallback); } catch (e) { fallback(); }
      break;
    }
    case 'download-backup': {
      try {
        const url = URL.createObjectURL(new Blob([backupText()], {type:'application/json'}));
        const link = Object.assign(document.createElement('a'), {href:url, download:`swasthifyme_backup_${localDate()}.json`});
        document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
        snack(t('me.dlHint')); markBackup();
      } catch (e) { snack(t('me.dlBlocked')); }
      break;
    }
    case 'restore-paste': { const tx = $('#restoreText').value.trim(); if (!tx){ snack(t('me.pasteFirst')); break; } askConfirm(t('c.restore'), t('c.restoreOk'), () => restoreFrom(tx)); break; }
    case 'clear-day': askConfirm(t('c.clearDay', {d:fmtDay(selectedDate)}), t('c.clearOk'), () => { delete state.logs[selectedDate]; delete state.weights[selectedDate]; save(); snack(t('c.cleared')); render(); }); break;
    case 'load-demo': {
      const go = () => { state = sampleState({...state.settings}); reindex(); save(); setView('today'); };
      Object.keys(state.logs).length && !state.sample ? askConfirm(t('c.demo'), t('c.demoOk'), go) : go(); break;
    }
    case 'reset-all': askConfirm(t('c.reset'), t('me.reset'), () => { const keep = {...state.settings}; state = normalizeState({settings:keep}); reindex(); save(); snack(t('c.resetDone')); setView('today'); startOnboarding(); }); break;
    case 'install': doInstall(); break;
    // onboarding
    case 'ob-lang': state.settings.lang = LANG = b.dataset.v; persistQuiet(); renderShell(); renderOnboarding(); break;
    case 'ob-units': readObInputs(); state.settings.units = b.dataset.v; persistQuiet(); renderOnboarding(); break;
    case 'ob-set': { readObInputs(); const k = b.dataset.k, v = b.dataset.v; ob.d[k] = ['activity','pace'].includes(k) ? Number(v) : v; renderOnboarding(); break; }
    case 'ob-region': { const r = b.dataset.v; ob.d.regions = ob.d.regions.includes(r) ? ob.d.regions.filter(x => x !== r) : [...ob.d.regions, r]; b.setAttribute('aria-pressed', String(ob.d.regions.includes(r))); break; }
    case 'ob-next': readObInputs(); ob.step++; renderOnboarding(); $('#obTitle') && $('#obTitle').focus(); $('#onboard').scrollTop = 0; break;
    case 'ob-back': readObInputs(); ob.step--; renderOnboarding(); $('#obTitle') && $('#obTitle').focus(); break;
    case 'ob-skip': readObInputs(); if (ob.step < 3){ ob.step = 3; renderOnboarding(); } break;
    case 'ob-finish': finishOnboarding(true); break;
    case 'ob-demo': { state = sampleState({...state.settings}, false); reindex(); save(); closeOnboarding(); setView('today'); break; }
  }
});

let qTimer = null;
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.classList.contains('br-q')){
    const c = browserCtx(el), root = browserRoot(el); c.q = el.value; c.limit = 40;
    clearTimeout(qTimer); qTimer = setTimeout(() => renderBrowserResults(root, c), 80);
  } else if (el.id === 'nlq' && sheet){
    sheet.text = el.value; sheet.parsed = null;
    clearTimeout(qTimer); qTimer = setTimeout(renderQuickResults, 180);
  } else if (el.id === 'qty' && sheet){
    const v = parseFloat(el.value); if (v > 0){ sheet.qty = sheet.mode === 'g' ? v / sheet.src.grams : Math.min(50, v); updateFoodSheet(false); }
  } else if (el.closest('#goalsForm') && !el.hasAttribute('data-body') && el.dataset.p !== 'name') { state.profile = readGoalsForm(); updateCalcNote(); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.closest('#goalsForm')) onGoalsChange(el);
  else if (el.id === 'glassSel'){ state.settings.glassMl = Number(el.value); save(); }
  else if (el.id === 'restoreFile'){
    const file = el.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => askConfirm(t('c.restore'), t('c.restoreOk'), () => restoreFrom(String(reader.result)));
    reader.readAsText(file); el.value = '';
  } else if (el.id === 'datePick' && el.value) setDate(el.value);
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'customForm') saveCustom(ev);
  else if (ev.target.id === 'weightForm') saveWeight(ev);
  else if (ev.target.id === 'goalsForm') ev.preventDefault();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'nlq'){ ev.preventDefault(); const btn = $('[data-act="q-log"]', dlg); if (btn) btn.click(); }
  const menu = $('#themeMenu');
  if (!menu.hidden){
    const items = $$('button', menu), i = items.indexOf(document.activeElement);
    if (ev.key === 'ArrowDown'){ ev.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (ev.key === 'ArrowUp'){ ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (ev.key === 'Escape'){ openThemeMenu(false); $('#themeBtn').focus(); }
  }
});
$('#themeBtn').addEventListener('click', () => openThemeMenu($('#themeMenu').hidden));
$('#dateBtn').addEventListener('click', () => {
  const p = $('#datePick');
  try { if (p.showPicker) { p.showPicker(); return; } } catch (e) {}
  p.style.pointerEvents = 'auto'; p.focus(); p.click();
});
mqDark.addEventListener ? mqDark.addEventListener('change', () => { if (themePref() === 'system') applyTheme('system', true); }) : mqDark.addListener(() => applyTheme(themePref(), true));
window.addEventListener('hashchange', () => setView(location.hash.slice(1), false));
document.addEventListener('visibilitychange', () => { if (!document.hidden){ REV++; TCACHE.clear(); render(); } });

/* =========================================================
   INSTALL (PWA) + OFFLINE
   ========================================================= */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; if (view === 'today') renderToday(); if (view === 'me') renderMe(); });
window.addEventListener('appinstalled', () => { installEvent = null; snack(t('inst.toast')); render(); });
async function doInstall(){
  if (!installEvent) return;
  installEvent.prompt();
  try { await installEvent.userChoice; } catch (e) {}
  installEvent = null; render();
}
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline mode unavailable:', err)); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

/* =========================================================
   BOOT
   ========================================================= */
reindex();
$('#logoSlot').innerHTML = ic('leaf', 20);
$('#calIc').outerHTML = ic('chevD', 18);
applyTheme(themePref(), false);
renderShell();
// mark already-earned badges as seen so upgrading doesn't fire a burst of toasts
if (!state.sample){ const e = [...earnedBadges()].filter(b => !state.badgesSeen.includes(b)); if (e.length){ state.badgesSeen.push(...e); persistQuiet(); } }
setView(location.hash.slice(1) || 'today', false);
if (!state.onboarded && !state.sample) startOnboarding();
</script>
</body>
