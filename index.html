<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwasthifyMe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Indian diet, macro, water and weight tracker in English and Hindi. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SwasthifyMe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* Apply the saved theme before anything paints, so there is no flash of the wrong theme. */
(function(){ try { var t = localStorage.getItem('swasthifyme_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* =========================================================
   DESIGN TOKENS
   Tier 1 primitives are folded into tier 2 semantic tokens below; components read only semantic or component tokens.
   Every text pair is at least 4.5:1 in both themes. Dark mode uses deep charcoal (not pure black) for OLED screens.
   ========================================================= */
:root{
  --bg-canvas:#F4F7F2; --bg-surface:#FFFFFF; --bg-subtle:#EAF0E7; --bg-raised:#FFFFFF;
  --text-1:#13201A; --text-2:#4E5D54; --border-subtle:#DCE4DA; --border-strong:#76857C;
  --accent:#0A7A52; --accent-ink:#FFFFFF; --accent-soft:#DDF2E6; --accent-text:#075C3D;
  --warn:#8F5300; --warn-soft:#FCEFD8; --error:#B42F2F; --error-soft:#FBE6E4; --info:#1F6FAD; --info-soft:#E3EEF8;
  --nutr-protein:#B8325A; --nutr-carbs:#8F5A00; --nutr-fat:#1F6FAD; --nutr-fiber:#4A7314; --nutr-water:#0B7187;
  --veg:#1F8A3B; --egg:#B07A00; --nonveg:#8A3B1F; --on-error:#FFFFFF;
  --scrim:rgba(4,10,7,.5);
  --shadow-1:0 1px 2px rgba(19,32,26,.06),0 4px 14px rgba(19,32,26,.06);
  --shadow-3:0 10px 34px rgba(19,32,26,.18);
  /* component tokens */
  --ring-track:var(--bg-subtle); --ring-fill:var(--accent); --ring-over:var(--warn);
  --fab-bg:var(--accent); --fab-ink:var(--accent-ink);
  --snack-bg:var(--text-1); --snack-fg:var(--bg-surface); --snack-action:#7FE3B9;
  /* type, space, radius, motion */
  --display:"Bricolage Grotesque","Hind",system-ui,sans-serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --dur-fast:200ms; --dur-base:250ms; --dur-slow:450ms;
  --ease:cubic-bezier(.2,0,0,1); --ease-emph:cubic-bezier(.3,0,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg-canvas:#0B0F0D; --bg-surface:#121815; --bg-subtle:#1A221E; --bg-raised:#1F2924;
  --text-1:#E6EEE9; --text-2:#A3B2A9; --border-subtle:#26322C; --border-strong:#6A7A71;
  --accent:#3DCB95; --accent-ink:#04130D; --accent-soft:#12301F; --accent-text:#6FE0B4;
  --warn:#F0B14A; --warn-soft:#33260F; --error:#F07B7B; --error-soft:#361A1A; --info:#6BB4EE; --info-soft:#14283A;
  --nutr-protein:#F27E9A; --nutr-carbs:#EDB24A; --nutr-fat:#6BB4EE; --nutr-fiber:#A6D063; --nutr-water:#4CC9E0;
  --veg:#41BF62; --egg:#E8B341; --nonveg:#D47D52; --on-error:#1A0505;
  --scrim:rgba(0,0,0,.64); --shadow-1:none; --shadow-3:0 0 0 1px var(--border-subtle);
  --snack-bg:#E6EEE9; --snack-fg:#0B0F0D; --snack-action:#075C3D;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-canvas:#0B0F0D; --bg-surface:#121815; --bg-subtle:#1A221E; --bg-raised:#1F2924;
  --text-1:#E6EEE9; --text-2:#A3B2A9; --border-subtle:#26322C; --border-strong:#6A7A71;
  --accent:#3DCB95; --accent-ink:#04130D; --accent-soft:#12301F; --accent-text:#6FE0B4;
  --warn:#F0B14A; --warn-soft:#33260F; --error:#F07B7B; --error-soft:#361A1A; --info:#6BB4EE; --info-soft:#14283A;
  --nutr-protein:#F27E9A; --nutr-carbs:#EDB24A; --nutr-fat:#6BB4EE; --nutr-fiber:#A6D063; --nutr-water:#4CC9E0;
  --veg:#41BF62; --egg:#E8B341; --nonveg:#D47D52; --on-error:#1A0505;
  --scrim:rgba(0,0,0,.64); --shadow-1:none; --shadow-3:0 0 0 1px var(--border-subtle);
  --snack-bg:#E6EEE9; --snack-fg:#0B0F0D; --snack-action:#075C3D;
  color-scheme:dark;
}
html.theme-anim, html.theme-anim *{transition:background-color var(--dur-base) var(--ease),color var(--dur-base) var(--ease),border-color var(--dur-base) var(--ease),fill var(--dur-base),stroke var(--dur-base)!important}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg-canvas);color:var(--text-1);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
:lang(hi){line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.eyebrow{font-size:.8125rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--text-2)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:var(--r-sm);font-weight:600}
[tabindex="-1"]:focus{outline:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);
  padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{display:none;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--display);font-weight:800;font-size:1.125rem;line-height:1}
.brand-name b{color:var(--accent-text)}
.hdr{display:flex;align-items:center;gap:6px;min-height:48px}
.date-btn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:var(--r-sm);font-weight:700;font-size:1.0625rem;font-family:var(--display)}
.date-btn:hover{background:var(--bg-subtle)}
.date-btn .ic{color:var(--text-2);width:18px;height:18px}
.spacer{flex:1}
.chip-btn{display:inline-flex;align-items:center;gap:5px;min-height:44px;min-width:44px;justify-content:center;padding:0 10px;border-radius:999px;font-weight:700;font-size:.9375rem;color:var(--text-1)}
.chip-btn:hover{background:var(--bg-subtle)}
.streak-chip .ic{color:var(--warn)}
.theme-wrap{position:relative}
.menu{position:absolute;right:0;top:50px;z-index:40;min-width:200px;background:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-3);padding:6px;display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:var(--r-sm);text-align:left;font-size:.9375rem}
.menu button:hover{background:var(--bg-subtle)}
.menu button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.menu small{display:block;font-size:.8125rem;color:var(--text-2);font-weight:400;line-height:1.2}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg-surface);border-top:1px solid var(--border-subtle);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;color:var(--text-2);font-size:.8125rem;font-weight:600}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab[aria-current="page"] .ic{stroke-width:2.4}
.tab.fab{color:var(--text-1)}
.fab-dot{width:56px;height:56px;border-radius:50%;background:var(--fab-bg);color:var(--fab-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 4px 14px rgba(10,122,82,.35);transition:transform var(--dur-fast) var(--ease)}
.tab.fab:active .fab-dot{transform:scale(.94)}
.fab-dot .ic{width:26px;height:26px;stroke-width:2.6}
.fab-label{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.side-foot{display:none}
.main{min-width:0;padding-block:12px calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

@media (min-width:960px){
  .app{grid-template-columns:260px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:18px;height:100vh;top:0;border-bottom:0;border-right:1px solid var(--border-subtle);padding:22px 16px}
  .brand{display:flex}
  .hdr{flex-wrap:wrap}
  .tabs{position:static;display:flex;flex-direction:column;align-items:stretch;gap:2px;border:0;padding:0;background:none}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 12px;border-radius:var(--r-sm);font-size:.9375rem}
  .tab:hover{background:var(--bg-subtle);color:var(--text-1)}
  .tab[aria-current="page"]{background:var(--accent-soft)}
  .tab.fab{order:-1;background:var(--fab-bg);color:var(--fab-ink);margin-bottom:10px;justify-content:center}
  .tab.fab:hover{background:var(--fab-bg);filter:brightness(1.06)}
  .fab-dot{width:auto;height:auto;margin:0;background:none;box-shadow:none;color:inherit}
  .fab-dot .ic{width:20px;height:20px}
  .fab-label{position:static!important;width:auto;height:auto;clip:auto}
  .side-foot{display:block;margin-top:auto;font-size:.8125rem;color:var(--text-2)}
  .main{padding-block:28px 48px}
}

/* ---------- common ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-1);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-h h2{font-size:1.125rem}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.view-head h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;font-size:.9375rem;border:1px solid var(--border-strong);background:var(--bg-surface);color:var(--text-1);text-decoration:none}
.btn:hover{background:var(--bg-subtle)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.water{background:var(--nutr-water);border-color:var(--nutr-water);color:#fff}
.btn.water:hover{filter:brightness(1.06);background:var(--nutr-water)}
:root[data-theme="dark"] .btn.water{color:#04130D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.water{color:#04130D}}
.btn.danger{color:var(--error);border-color:color-mix(in srgb,var(--error) 45%,transparent);background:var(--error-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--bg-subtle);color:var(--text-1)}
.icon-btn.soft{background:var(--bg-subtle);color:var(--text-1);border:1px solid var(--border-subtle)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:.9375rem}
.banner.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.banner.good{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner strong{font-weight:700}
.banner .row{display:flex;gap:6px;flex-wrap:wrap}
.mark{width:14px;height:14px;border:1.5px solid var(--veg);border-radius:3px;display:inline-grid;place-items:center;flex:none;background:var(--bg-surface)}
.mark::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.mark.egg{border-color:var(--egg)}
.mark.egg::after{background:var(--egg);border-radius:50% 50% 45% 45%/60% 60% 40% 40%;width:6px;height:7px}
.mark.nonveg{border-color:var(--nonveg)}
.mark.nonveg::after{width:0;height:0;border-radius:0;background:none;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--nonveg)}
.bar-track{height:8px;border-radius:99px;background:var(--bg-subtle);box-shadow:inset 0 0 0 1px var(--border-subtle);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width var(--dur-slow) var(--ease)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.8125rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--accent-text)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--bg-subtle);color:var(--text-2)}
.empty{padding:16px;text-align:center;color:var(--text-2);font-size:.9375rem}
.seg{display:inline-flex;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:40px;padding:0 12px;border-radius:9px;font-weight:600;font-size:.875rem;color:var(--text-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bg-surface);color:var(--text-1);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapy{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--border-strong);background:var(--bg-surface);font-size:.875rem;font-weight:600;color:var(--text-1);white-space:nowrap;max-width:260px}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sug{border-style:dashed}
.chip.sug:hover{background:var(--accent-soft)}
.chip .ic{width:16px;height:16px}
.input{min-height:44px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--bg-surface);padding:0 12px;width:100%;min-width:0}
.input:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:0}
select.input{padding-right:8px}
textarea.input{min-height:96px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:.8125rem;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:.875rem;font-weight:600;color:var(--text-2)}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
@media (min-width:760px){.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.c-p{color:var(--nutr-protein)} .c-c{color:var(--nutr-carbs)} .c-f{color:var(--nutr-fat)} .c-fb{color:var(--nutr-fiber)} .c-w{color:var(--nutr-water)}

/* ---------- today ---------- */
.greet{font-size:.9375rem;color:var(--text-2)}
.week{display:flex;align-items:center;gap:2px}
.week-days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;justify-content:center;border-radius:12px;font-size:.8125rem;color:var(--text-2);font-weight:600;border:1.5px solid transparent}
.wd b{font-size:1rem;color:var(--text-1);font-variant-numeric:tabular-nums}
.wd i{width:6px;height:6px;border-radius:50%;margin-top:2px;border:1.5px solid transparent}
.wd i.full{background:var(--accent)}
.wd i.part{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 35%,transparent)}
.wd i.miss{border-color:var(--border-strong)}
.wd.today{border-color:var(--border-strong)}
.wd[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wd[aria-pressed="true"] b{color:var(--accent-ink)}
.wd[aria-pressed="true"] i.full,.wd[aria-pressed="true"] i.part{background:var(--accent-ink);border-color:var(--accent-ink)}
.wd[aria-pressed="true"] i.miss{border-color:var(--accent-ink)}
.wd:disabled{opacity:.35;cursor:default}
.wd:hover:not(:disabled):not([aria-pressed="true"]){background:var(--bg-subtle)}
.today-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"sum" "ins" "tl" "water" "wt"}
@media (min-width:1100px){.today-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"tl sum" "tl ins" "tl water" "tl wt" "tl .";align-items:start}}
.a-sum{grid-area:sum}.a-ins{grid-area:ins}.a-tl{grid-area:tl}.a-water{grid-area:water}.a-wt{grid-area:wt}
.sum-body{display:flex;gap:16px;align-items:center}
@media (max-width:380px){.sum-body{flex-direction:column}}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset var(--dur-slow) var(--ease)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.ring-c b{font-family:var(--display);font-size:2rem;font-weight:800}
.ring-c span{font-size:.8125rem;color:var(--text-2);font-weight:600}
.ring.pulse{animation:pulse .6s var(--ease-emph)}
@keyframes pulse{50%{transform:scale(1.05)}}
.macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;width:100%}
.mc .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:.875rem;margin-bottom:4px}
.mc .lbl{font-weight:700}
.mc .val{color:var(--text-2);font-variant-numeric:tabular-nums;text-align:right}
.mc .val b{color:var(--text-1)}
.sum-foot{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-subtle);font-size:.875rem}
.insight{display:flex;gap:12px;align-items:flex-start;background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 25%,transparent);border-radius:var(--r-md);padding:14px}
.insight .badge-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg-surface);color:var(--info);flex:none}
.insight p{font-size:.9375rem}
.insight .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.insight .row .btn{min-height:40px;font-size:.875rem;padding:0 12px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.meal{position:relative;padding-left:22px}
.meal::before{content:"";position:absolute;left:6px;top:28px;bottom:-14px;width:2px;background:var(--border-subtle)}
.meal:last-child::before{display:none}
.meal::after{content:"";position:absolute;left:0;top:18px;width:14px;height:14px;border-radius:50%;background:var(--bg-canvas);border:2.5px solid var(--border-strong)}
.meal.done::after{background:var(--accent);border-color:var(--accent)}
.meal-card{padding:12px 12px 12px 14px}
.meal-h{display:flex;align-items:center;gap:10px}
.meal-h .t{flex:1;min-width:0}
.meal-h h3{font-size:1.0625rem;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.meal-h h3 span{font-family:var(--body);font-weight:500;font-size:.875rem;color:var(--text-2)}
.meal-h p{font-size:.875rem;color:var(--text-2)}
.meal-ic{width:40px;height:40px;border-radius:12px;background:var(--bg-subtle);color:var(--accent-text);display:grid;place-items:center;flex:none}
.items{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--border-subtle)}
.items li{position:relative;overflow:hidden;border-bottom:1px solid var(--border-subtle)}
.items li:last-child{border-bottom:0}
.del-bg{position:absolute;inset:0;background:var(--error);color:var(--on-error);display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-weight:700;font-size:.875rem}
.item{position:relative;width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 4px;min-height:56px;background:var(--bg-surface);touch-action:pan-y;transition:transform var(--dur-fast) var(--ease)}
.item.dragging{transition:none}
.item:hover{background:var(--bg-subtle)}
.item .txt{min-width:0;flex:1}
.item .nm{display:block;font-weight:600;font-size:.9375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{display:block;font-size:.8125rem;color:var(--text-2)}
.item .kc{font-weight:700;font-size:.9375rem;white-space:nowrap}
.sugs{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.sugs .lbl{font-size:.8125rem;color:var(--text-2);font-weight:600}
.water-card .top{display:flex;align-items:center;gap:12px}
.water-card .top .t{flex:1;min-width:0}
.water-card h2{font-size:1.0625rem}
.water-card .btns{display:flex;gap:6px;align-items:center}
.water-card .bar-fill{background:var(--nutr-water)}
.wt-card{display:flex;align-items:center;gap:12px}
.wt-card .t{flex:1;min-width:0}
.wt-card h2{font-size:1.0625rem}

/* ---------- food lists ---------- */
.searchbar{position:relative}
.searchbar .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-2);pointer-events:none}
.searchbar input{min-height:50px;padding-left:44px;border-radius:var(--r-md);font-size:1rem}
.flist{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.page .flist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.frow{display:flex;align-items:center;gap:4px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-md);min-width:0;padding-right:6px}
.frow-main{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;padding:10px 6px 10px 14px;min-height:60px;border-radius:var(--r-md)}
.frow-main:hover{background:var(--bg-subtle)}
.frow .txt{flex:1;min-width:0}
.frow .nm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.9375rem}
.frow .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .sub{display:block;font-size:.8125rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .kc{text-align:right;flex:none;font-size:.8125rem;color:var(--text-2);line-height:1.25}
.frow .kc b{display:block;font-size:1rem;color:var(--text-1);font-family:var(--display)}
.add-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.add-btn:hover{background:var(--accent);color:var(--accent-ink)}
.add-btn.ok{background:var(--accent);color:var(--accent-ink)}
.tag{font-size:.6875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--bg-subtle);color:var(--text-2);flex:none}
.tag.out{background:var(--warn-soft);color:var(--warn)}
.fav-on{color:var(--warn)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r-md);border:1px dashed var(--border-strong);background:var(--bg-surface)}
.src-note{font-size:.8125rem;color:var(--text-2)}

/* ---------- trends ---------- */
.stats{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:900px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat .v{font-family:var(--display);font-size:1.75rem;font-weight:800;line-height:1.1;margin-top:4px}
.stat .v small{font-family:var(--body);font-size:.875rem;font-weight:500;color:var(--text-2)}
.stat .n{font-size:.8125rem;color:var(--text-2);margin-top:6px}
.trend-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.trend-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.plot{position:relative;height:180px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;border-bottom:1px solid var(--border-strong);margin-top:24px}
.band{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--accent) 12%,transparent);border-top:1px dashed var(--accent);border-bottom:1px dashed var(--accent);pointer-events:none}
.band span{position:absolute;right:0;top:-20px;font-size:.75rem;color:var(--text-2)}
.bcol{position:relative;height:100%;display:flex;justify-content:center;align-items:flex-end;border-radius:6px;z-index:1}
.bcol:hover{background:color-mix(in srgb,var(--text-1) 5%,transparent)}
.bfill{width:min(30px,70%);border-radius:6px 6px 2px 2px;background:var(--accent);position:relative;transition:height var(--dur-slow) var(--ease)}
.bfill.over{background:var(--warn)}
.bfill.none{background:var(--border-subtle)}
.bcol.sel .bfill{box-shadow:0 0 0 2px var(--bg-surface),0 0 0 4px var(--text-1)}
.bval{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:600;white-space:nowrap;color:var(--text-2)}
.xlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:.8125rem;color:var(--text-2);margin-top:6px}
.xlabels .sel{color:var(--text-1);font-weight:700}
.hits{display:grid;grid-template-columns:76px repeat(7,minmax(0,1fr));gap:6px 4px;align-items:center;font-size:.875rem}
.hits .h{font-size:.75rem;color:var(--text-2);text-align:center}
.hit{width:18px;height:18px;border-radius:50%;margin:0 auto;border:2px solid var(--border-strong)}
.hit.on{background:var(--accent);border-color:var(--accent)}
.hit.na{border-style:dotted;opacity:.5}
.avg-row{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.875rem;padding:6px 0}
.avg-row b{font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .h{font-size:.75rem;color:var(--text-2);padding-bottom:2px}
.cday{aspect-ratio:1;max-width:100%;border-radius:9px;display:grid;place-items:center;font-size:.8125rem;font-weight:600;background:var(--bg-subtle);color:var(--text-2);border:1.5px solid transparent}
.cday.on{background:var(--accent);color:var(--accent-ink)}
.cday.over{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.cday.under{background:var(--bg-surface);color:var(--text-1);border-color:var(--accent)}
.cday.sel{outline:2px solid var(--text-1);outline-offset:1px}
.cday:disabled{opacity:.4;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8125rem;color:var(--text-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.wchart svg{width:100%;height:auto;display:block}
.wchart text{fill:var(--text-2);font-size:10px;font-family:var(--body)}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.bdg{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);border:1px solid var(--border-subtle);background:var(--bg-surface)}
.bdg .medal{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--bg-subtle);color:var(--text-2);font-family:var(--display);font-weight:800}
.bdg.on .medal{background:var(--accent-soft);color:var(--accent-text)}
.bdg:not(.on){opacity:.75}
.bdg b{display:block;font-size:.9375rem}
.bdg p{font-size:.8125rem;color:var(--text-2)}

/* ---------- me ---------- */
.me-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.me-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.calc-note{font-size:.875rem;background:var(--bg-subtle);border-radius:var(--r-sm);padding:10px 12px}
.saved{font-size:.8125rem;font-weight:700;color:var(--accent-text);opacity:0;transition:opacity var(--dur-fast)}
.saved.show{opacity:1}
.pref{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--border-subtle)}
.pref:first-of-type{border-top:0;padding-top:0}
.pref .lbl{font-weight:700;font-size:.9375rem}
.pref .hint{font-size:.8125rem;color:var(--text-2)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.ht-imp{display:flex;gap:8px}
details.adv summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent-text)}
.legal{font-size:.875rem;color:var(--text-2);display:flex;flex-direction:column;gap:8px}

/* ---------- sheet (native dialog) ---------- */
dialog.sheet{padding:0;border:0;background:transparent;color:var(--text-1);width:100%;max-width:560px;max-height:none;margin:auto auto 0;overflow:visible}
dialog.sheet::backdrop{background:rgba(4,10,7,.55)}
.sheet-in{background:var(--bg-raised);border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up var(--dur-base) var(--ease-emph)}
.sheet-in.tall{min-height:80dvh}
@keyframes up{from{transform:translateY(32px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:700px){dialog.sheet{margin:auto}.sheet-in{border-radius:var(--r-lg);padding-block:20px;max-height:86vh}.sheet-in.tall{min-height:0;height:min(720px,86vh)}}
.grip-zone{display:flex;justify-content:center;padding:6px 0 2px;touch-action:none;cursor:grab}
.grip{width:44px;height:5px;border-radius:9px;background:var(--border-strong)}
@media (min-width:700px){.grip-zone{display:none}}
.sheet-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet-h h2{font-size:1.25rem;display:flex;align-items:center;gap:8px;min-width:0}
.sheet-h h2 span{overflow-wrap:anywhere}
.sheet-foot{position:sticky;bottom:0;background:var(--bg-raised);padding-block:10px;border-top:1px solid var(--border-subtle);display:flex;gap:8px;align-items:center}
.preview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--bg-subtle);border-radius:var(--r-md);padding:10px 6px;text-align:center}
.preview span{display:block;font-size:.75rem;font-weight:600}
.preview b{font-size:1.0625rem;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;background:var(--bg-subtle);border:1px solid var(--border-subtle);font-size:1.375rem;font-weight:700}
.stepper input{flex:1;height:48px;text-align:center;font-size:1.375rem;font-weight:700;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-surface);min-width:0}
.sheet-actions{display:flex;gap:8px}
.sheet-actions .primary{flex:1}
.nl-input{display:flex;gap:6px;align-items:stretch}
.nl-input input{flex:1;min-height:52px;font-size:1rem;border-radius:var(--r-md);border:1.5px solid var(--accent)}
.parsed{list-style:none;margin:0;padding:0;border:1px solid var(--border-subtle);border-radius:var(--r-md);background:var(--bg-surface)}
.parsed li{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--border-subtle)}
.parsed li:last-child{border-bottom:0}
.parsed .txt{flex:1;min-width:0}
.parsed .nm{display:block;font-weight:600;font-size:.9375rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parsed .sub{display:block;font-size:.8125rem;color:var(--text-2)}
.mini-step{display:flex;align-items:center;gap:2px}
.mini-step button{width:36px;height:44px;border-radius:10px;font-size:1.125rem;font-weight:700;color:var(--text-1)}
.mini-step button:hover{background:var(--bg-subtle)}
.mini-step output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.unmatched{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;border-radius:var(--r-md);background:var(--warn-soft);font-size:.875rem}
.sec-lbl{font-size:.8125rem;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}

/* ---------- snackbar ---------- */
.snack{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:70;display:flex;align-items:center;gap:12px;background:var(--snack-bg);color:var(--snack-fg);font-weight:600;font-size:.9375rem;padding:6px 6px 6px 16px;min-height:48px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);width:max-content;max-width:min(560px,calc(100% - 24px));box-shadow:var(--shadow-3)}
.snack.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack button{min-height:40px;padding:0 12px;border-radius:9px;font-weight:800;color:var(--snack-action);text-transform:uppercase;letter-spacing:.04em;font-size:.875rem}
.snack button:hover{background:color-mix(in srgb,var(--snack-fg) 10%,transparent)}
.snack:not(:has(button)){padding-right:16px}
@media (min-width:960px){.snack{bottom:28px}}
dialog .snack{bottom:calc(16px + env(safe-area-inset-bottom,0px))}

/* ---------- onboarding ---------- */
.ob{position:fixed;inset:0;z-index:80;background:var(--bg-canvas);overflow-y:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.ob-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--border-strong)}
.dots i.on{width:22px;background:var(--accent)}
.ob h1{font-size:1.75rem;font-weight:800}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:60px;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--border-subtle);background:var(--bg-surface);font-weight:600}
.opt small{display:block;font-weight:400;font-size:.875rem;color:var(--text-2)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .oi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg-subtle);color:var(--accent-text);flex:none}
.ob-actions{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plan div{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:14px 8px;text-align:center}
.plan b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:800}
.plan span{font-size:.8125rem;color:var(--text-2)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0ms!important;transition-duration:0ms!important}
  html.theme-anim, html.theme-anim *{transition:none!important}
}
</style>

<div class="app">
  <header class="side">
    <div class="brand"><span class="logo" id="logoSlot"></span><div class="brand-name">Swasthify<b>Me</b></div></div>

      <button class="date-btn" id="dateBtn" aria-haspopup="dialog"><span id="dateLabel">Today</span><span id="calIc"></span></button>

</div>

function shiftDate(s, n){ const d = parseDate(s); d.setDate(d.getDate() + n); return localDate(d); }

/* search normalisation */
const norm = s => String(s || '').toLowerCase().normalize('NFC').replace(/[()\/,.+\-–—:;'’"!?&]/g, ' ').replace(/\s+/g, ' ').trim();
function indexFood(f){
  const base = norm([f.name, f.local, f.hi].join(' '));
  const words = new Set(base.split(' ').filter(Boolean));
  for (const g of ALIAS_GROUPS) if (g.some(w => words.has(w))) g.forEach(w => words.add(w));
  // Spelling variants count as the main name only when they come from the English name:
  // "ज्वार की रोटी" (jowar bhakri) should not rank as high as Roti for "roti".
  const nm = new Set(norm(f.name).split(' ').filter(Boolean));
  for (const g of ALIAS_GROUPS) if (g.some(w => nm.has(w))) g.forEach(w => nm.add(w));
  norm(f.hi).split(' ').filter(Boolean).forEach(w => nm.add(w));
  f._name = [...nm];
  f._words = [...words];
}
let BY_ID = new Map();
function reindex(){
  BY_ID = new Map();
  for (const f of allFoods()){ if (!f._words) indexFood(f); BY_ID.set(f.id, f); }
}
function lev1(a, b){
  if (a === b) return true;
  const la = a.length, lb = b.length; if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < la && j < lb){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++edits > 1) return false;
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }
  }
  return edits + (la - i) + (lb - j) <= 1;
}
function termScore(tok, f){
  let best = 0;
  for (const w of f._name){ if (w === tok) return 4; if (w.startsWith(tok)) best = Math.max(best, 3); }
  for (const w of f._words){
    if (w === tok) best = Math.max(best, 2.5);
    else if (w.startsWith(tok)) best = Math.max(best, 2);
    else if (tok.length >= 3 && w.includes(tok)) best = Math.max(best, 1);
  }
  if (!best && tok.length >= 4){
    for (const w of f._words){
      if (lev1(w, tok)) { best = 0.9; break; }
      if (w.length > tok.length && lev1(w.slice(0, tok.length), tok)) best = Math.max(best, 0.6);
    }
  }
  return best;
}

function makeEntry(food, servings, date, slot){
  const now = Date.now(), today = localDate();
  return {id:uid('log'), foodId:food.id, name:food.name, local:food.local || '', hi:food.hi || '', serving:food.serving, diet:food.diet, servings,
    base:{cal:+food.cal || 0, p:+food.p || 0, c:+food.c || 0, f:+food.f || 0, fib:+food.fib || 0},
    loggedAt: date === today ? now : slotTime(date, slot)};
}

function normalizeState(raw){
  raw = raw && typeof raw === 'object' ? raw : {};
  const s = {version:3, profile:{...DEFAULT_PROFILE}, settings:{...DEFAULT_SETTINGS}, customFoods:[], logs:{}, weights:{}, favourites:[],
    badgesSeen:[], muted:{}, lastBackup:null, sample:!!raw.sample, onboarded:false, celebrated:null, dismissed:{}};
  const rp = raw.profile || {};
  for (const k of Object.keys(DEFAULT_PROFILE)){
    if (rp[k] === undefined || rp[k] === '') continue;
    s.profile[k] = typeof DEFAULT_PROFILE[k] === 'number' ? (Number(rp[k]) || DEFAULT_PROFILE[k]) : String(rp[k]);
  }
  if (!['male','female','other'].includes(s.profile.sex)) s.profile.sex = 'male';
  if (!['lose','maintain','gain','protein'].includes(s.profile.goal)) s.profile.goal = 'maintain';
  const rs = raw.settings || {};
  if (['en','hi'].includes(rs.lang)) s.settings.lang = rs.lang;
  if (['metric','imperial'].includes(rs.units)) s.settings.units = rs.units;
  if (DIET_OK[rs.diet]) s.settings.diet = rs.diet;
  if (Array.isArray(rs.regions)) s.settings.regions = rs.regions.filter(r => REGIONS.includes(r));
  if (+rs.glassMl >= 100 && +rs.glassMl <= 1500) s.settings.glassMl = +rs.glassMl;
  if (typeof rs.haptics === 'boolean') s.settings.haptics = rs.haptics;
  if (Array.isArray(raw.customFoods)) s.customFoods = raw.customFoods.filter(f => f && f.name).map(f => ({
    id:String(f.id || uid('cust')), name:String(f.name).slice(0, 80), local:String(f.local ?? f.hindi ?? '').slice(0, 80), hi:'',
    cat:SLOT_CATS.breakfast.concat(['lunch','dinner','snacks','fish','mithai']).includes(f.cat) ? f.cat : 'lunch',
    diet:f.diet && DIET_OK[f.diet] ? f.diet : typeToDiet(f.type, ''), regions:'',
    serving:String(f.serving || '1 serving').slice(0, 60), grams:gramsOf(f.serving || ''), cal:+f.cal || 0, p:+f.p || 0, c:+f.c || 0, f:+f.f || 0, fib:+f.fib || 0, custom:true, ord:-1}));
  const lookup = id => s.customFoods.find(f => f.id === id) || FOODS.find(f => f.id === id);
  const normEntry = (e, date, slot) => {
    const sv = Number(e.servings) > 0 ? Number(e.servings) : 1;
    let base = e.base;
    const food = lookup(e.foodId);
    if (!base){
      base = food ? {cal:food.cal, p:food.p, c:food.c, f:food.f, fib:food.fib || 0}
                  : {cal:(+e.cal || 0) / sv, p:(+e.p || 0) / sv, c:(+e.c || 0) / sv, f:(+e.f || 0) / sv, fib:(+e.fib || 0) / sv};
    }
    return {id:String(e.id || uid('log')), foodId:String(e.foodId || ''), name:String(e.name || 'Food item'), local:String(e.local ?? e.hindi ?? ''),
      hi:String(e.hi || (food && food.hi) || ''), serving:String(e.serving || '1 serving'),
      diet:e.diet && DIET_OK[e.diet] ? e.diet : typeToDiet(e.type || (food && food.diet) || 'veg', e.foodId), servings:sv,
      base:{cal:+base.cal || 0, p:+base.p || 0, c:+base.c || 0, f:+base.f || 0, fib:+base.fib || 0},
      loggedAt:Number(e.loggedAt) > 0 ? Number(e.loggedAt) : slotTime(date, slot)};
  };
  if (raw.logs && typeof raw.logs === 'object'){
    for (const [d, l] of Object.entries(raw.logs)){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !l) continue;
      const day = emptyDay();
      day.water = Math.max(0, +l.water || 0);
      SLOTS.forEach(k => { const arr = l.meals && l.meals[k]; if (Array.isArray(arr)) day.meals[k] = arr.filter(Boolean).map(e => normEntry(e, d, k)); });
      s.logs[d] = day;
    }
  }
  if (raw.weights && typeof raw.weights === 'object')
    for (const [d, w] of Object.entries(raw.weights)) if (/^\d{4}-\d{2}-\d{2}$/.test(d) && +w > 0) s.weights[d] = +w;
  if (Array.isArray(raw.favourites)) s.favourites = raw.favourites.filter(x => typeof x === 'string');
  if (Array.isArray(raw.badgesSeen)) s.badgesSeen = raw.badgesSeen.filter(x => typeof x === 'string');
  if (raw.muted && typeof raw.muted === 'object') s.muted = {...raw.muted};
  if (raw.dismissed && typeof raw.dismissed === 'object') s.dismissed = {...raw.dismissed};
  if (raw.lastBackup) s.lastBackup = String(raw.lastBackup);
  if (raw.celebrated) s.celebrated = String(raw.celebrated);
  // Older saves with real data skip onboarding; they get a one-time "personalise" card instead.
  if (typeof raw.onboarded === 'boolean') s.onboarded = raw.onboarded;
  else if (Object.keys(s.logs).length && !s.sample) { s.onboarded = true; s.dismissed.whatsNewPending = true; }
  return s;
}

  const day = getDay(d), out = {cal:0, p:0, c:0, f:0, fib:0, items:0, meals:0, water:day.water || 0};

  out.p = r1(out.p); out.c = r1(out.c); out.f = r1(out.f); out.fib = r1(out.fib);

}

/* body maths */
const calcBMR = p => Math.round(10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === 'female' ? -161 : p.sex === 'other' ? -78 : 5)); // Mifflin–St Jeor
const calcBMI = p => p.weight / Math.pow(p.height / 100, 2);
function bmiCat(b){ if (b < 18.5) return 'under'; if (b < 23) return 'normal'; if (b < 25) return 'over'; return 'obese'; }
function suggestTargets(p){
  const tdee = calcBMR(p) * p.activity;
  const delta = p.goal === 'lose' ? -p.pace * 7700 / 7 : p.goal === 'gain' ? p.pace * 7700 / 7 * 0.6 : 0;
  const floor = p.sex === 'female' ? 1200 : p.sex === 'other' ? 1350 : 1500;
  const cal = Math.max(floor, Math.round((tdee + delta) / 50) * 50);
  const perKg = p.goal === 'lose' || p.goal === 'protein' ? 1.6 : p.goal === 'gain' ? 1.8 : 1.2;
  const protein = Math.round(p.weight * perKg);
  const fat = Math.round(cal * 0.27 / 9);
  const carbs = Math.max(0, Math.round((cal - protein * 4 - fat * 9) / 4));
  const water = Math.max(2000, Math.round(p.weight * 35 / 250) * 250);
  return {goalCalories:cal, goalProtein:protein, goalCarbs:carbs, goalFat:fat, goalFiber:30, goalWater:water};
}

/* =========================================================
   HABITS: frequency, suggestions, streaks, badges, insights

let FREQ = null, FREQ_REV = -1;
function freqData(){
  if (FREQ && FREQ_REV === REV) return FREQ;
  const today = localDate(), from = shiftDate(today, -30);
  const bySlot = {breakfast:new Map(), lunch:new Map(), snacks:new Map(), dinner:new Map()}, any = new Map(), last = new Map();
  for (const [d, day] of Object.entries(state.logs)){
    if (d < from || d > today) continue;
    const age = (parseDate(today) - parseDate(d)) / 864e5, w = Math.pow(0.5, age / 7);
    SLOTS.forEach(k => day.meals[k].forEach(e => {
      bySlot[k].set(e.foodId, (bySlot[k].get(e.foodId) || 0) + w);
      any.set(e.foodId, (any.get(e.foodId) || 0) + w);
      if (!last.has(e.foodId) || last.get(e.foodId) < e.loggedAt) last.set(e.foodId, e.loggedAt);
    }));
  }
  FREQ = {bySlot, any, last}; FREQ_REV = REV;
  return FREQ;
}
function regionBoost(f){
  const regs = state.settings.regions; if (!regs.length) return 0;
  if (!f.regions) return 0.3;
  return [...f.regions].some(r => regs.includes(r)) ? 1 : 0;
}
function personalScore(f, slot){
  const F = freqData();
  return Math.min(3, (F.bySlot[slot].get(f.id) || 0) * 0.8) + Math.min(1, (F.any.get(f.id) || 0) * 0.2)
    + (state.favourites.includes(f.id) ? 1.5 : 0) + regionBoost(f) + (SLOT_CATS[slot].includes(f.cat) ? 0.8 : 0)
    + (POPULAR.has(f.id) ? 0.5 - POPULAR_RANK.get(f.id) * 0.01 : 0);
}
function searchFoods(q, slot){
  const toks = norm(q).split(' ').filter(x => x && !STOP.has(x));
  if (!toks.length) return [];
  const out = [];
  for (const f of allFoods()){
    let s = 0, ok = true;
    for (const tk of toks){ const ts = termScore(tk, f); if (!ts){ ok = false; break; } s += ts; }
    if (!ok) continue;
    const match = s;
    s += personalScore(f, slot) * 0.5 - f.name.length * 0.004;
    if (!dietOk(f)) s -= 6;
    out.push({f, s, match, n:toks.length});
  }
  return out.sort((a, b) => b.s - a.s);
}
function suggestions(slot, n, date){
  const logged = new Set(getDay(date || selectedDate).meals[slot].map(e => e.foodId));
  return allFoods().filter(f => dietOk(f) && !logged.has(f.id))
    .map(f => ({f, s:personalScore(f, slot) - (f.ord < 0 ? 0 : f.ord * 0.0005)}))
    .sort((a, b) => b.s - a.s).slice(0, n).map(x => x.f);
}
function recentFoods(n = 30){
  const F = freqData();
  return [...F.last.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => findFood(id)).filter(Boolean).slice(0, n);
}
function usualMeals(slot){
  const today = localDate(), counts = new Map();
  for (let i = 1; i <= 21; i++){
    const d = shiftDate(today, -i), items = getDay(d).meals[slot];
    const ids = [...new Set(items.map(e => e.foodId))].sort();
    if (ids.length < 2 || ids.length > 5) continue;
    const key = ids.join('|');
    const c = counts.get(key) || {n:0, items, d};
    c.n++; counts.set(key, c);
  }
  return [...counts.values()].filter(c => c.n >= 3).sort((a, b) => b.n - a.n).slice(0, 2)
    .map(c => c.items.filter(e => findFood(e.foodId)).map(e => ({food:findFood(e.foodId), qty:e.servings})));
}

let STREAK = null, STREAK_REV = -1;
function streakInfo(){
  if (STREAK && STREAK_REV === REV) return STREAK;
  const dates = Object.keys(state.logs).filter(d => totals(d).items > 0).sort();
  const res = {cur:0, best:0, freezes:0};
  if (dates.length){
    const today = localDate(), yest = shiftDate(today, -1), morning = new Date().getHours() < 12;
    let d = dates[0], guard = 0;
    while (d <= today && guard++ < 4000){
      const ok = totals(d).meals >= 2;
      if (ok){ res.cur++; if (res.cur % 7 === 0) res.freezes = Math.min(2, res.freezes + 1); res.best = Math.max(res.best, res.cur); }
      else if (d === today || (d === yest && morning)) { /* still time to log */ }
      else if (res.cur > 0 && res.freezes > 0) res.freezes--;
      else res.cur = 0;
      d = shiftDate(d, 1);
    }
  }
  STREAK = res; STREAK_REV = REV;
  return res;
}

function earnedBadges(){

  const P = state.profile, dates = Object.keys(state.logs).filter(d => totals(d).items > 0).sort(), set = new Set();
  const day = d => getDay(d);
  if (dates.some(d => day(d).meals.breakfast.length && day(d).meals.lunch.length && day(d).meals.dinner.length)) set.add('first_thali');
  const st = streakInfo();
  if (st.best >= 7) set.add('saptah');
  if (st.best >= 30) set.add('month');
  let run = 0, prev = null;
  for (const d of Object.keys(state.logs).sort()){
    if ((state.logs[d].water || 0) >= P.goalWater){ run = prev && shiftDate(prev, 1) === d ? run + 1 : 1; prev = d; if (run >= 7) { set.add('jal'); break; } }
    else { run = 0; prev = null; }
  }
  const windowHits = test => dates.some(end => { let n = 0; for (let i = 0; i < 7; i++){ const d = shiftDate(end, -i); if (totals(d).items && test(totals(d))) n++; } return n >= 5; });
  if (windowHits(x => x.p >= P.goalProtein * 0.9)) set.add('protein');
  if (windowHits(x => x.fib >= P.goalFiber * 0.9)) set.add('fiber');
  if (state.customFoods.length >= 3) set.add('ghar');
  if (dates.filter(d => SLOTS.some(k => day(d).meals[k].some(e => MILLET_IDS.has(e.foodId)))).length >= 10) set.add('millet');
  BADGE = set; BADGE_REV = REV;
  return set;
}
function checkAchievements(){
  if (state.sample) return;
  const earned = earnedBadges(), fresh = [...earned].filter(b => !state.badgesSeen.includes(b));
  if (fresh.length){
    state.badgesSeen.push(...fresh); persistQuiet();
    setTimeout(() => snack(t('badge.new', {name:t('b.' + fresh[0])})), 3200);
  }
}
function persistQuiet(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function insightFor(){
  const today = localDate(); if (selectedDate !== today || state.sample) return null;
  const P = state.profile, now = new Date(), muted = r => state.muted[r] && state.muted[r] > today;
  const past = Array.from({length:7}, (_, i) => shiftDate(today, -(i + 1))).filter(d => totals(d).items > 0);
  const T = totals(today), glass = state.settings.glassMl;
  const hour = now.getHours() + now.getMinutes() / 60;
  if (!muted('water') && hour >= 13 && hour < 21){
    const expected = P.goalWater * clamp((hour - 7) / 14, 0, 1), behind = Math.floor((expected - T.water) / glass);
    if (behind >= 2) return {id:'water', icon:'drop', text:t('in.water', {n:behind}), act:'water-add', actLabel:'+ ' + t('water.glass')};
  }
  if (past.length >= 3){
    const low = past.filter(d => totals(d).p < P.goalProtein * 0.6).length;
    if (!muted('protein') && low >= 3){
      const tip = state.settings.diet === 'vegan' ? 'in.protein.vegan' : state.settings.diet === 'veg' ? 'in.protein.veg' : 'in.protein.egg';
      return {id:'protein', icon:'target', text:t('in.protein', {n:low, d:past.length, tip:t(tip)}), act:'insight-protein', actLabel:t('in.protein.act')};
    }
    const avgFib = past.reduce((a, d) => a + totals(d).fib, 0) / past.length;
    if (!muted('fiber') && avgFib < P.goalFiber * 0.6)
      return {id:'fiber', icon:'leaf', text:t('in.fiber', {n:Math.round(avgFib), g:P.goalFiber}), act:'insight-guava', actLabel:t('in.fiber.act')};
    const dinCal = past.reduce((a, d) => a + getDay(d).meals.dinner.reduce((x, e) => x + entryVals(e).cal, 0), 0), allCal = past.reduce((a, d) => a + totals(d).cal, 0);
    if (!muted('dinner') && allCal > 0 && dinCal / allCal > 0.42) return {id:'dinner', icon:'moon', text:t('in.dinner', {p:Math.round(dinCal / allCal * 100)})};
    const last3 = [1, 2, 3].map(i => totals(shiftDate(today, -i)));
    if (!muted('praise') && last3.every(x => x.items && x.p >= P.goalProtein * 0.9)) return {id:'praise', icon:'sparkle', text:t('in.praise')};
  }
  const loggedDays = Object.keys(state.logs).filter(d => totals(d).items > 0).length;
  if (!muted('start') && loggedDays < 3) return {id:'start', icon:'bulb', text:t('in.start'), act:'quick-log', actLabel:t('in.start.act')};
  return null;
}

function matchesFilter(f, filter){
  switch (filter){
    case 'fruit': case 'dryfruit': case 'fish': case 'mithai': return f.cat === filter;
    case 'maharashtrian': return f.id.startsWith('mh_');
    case 'faral': return f.id.startsWith('dw_') || FARAL_EXTRA.has(f.id);
    case 'high-protein': return f.p >= 10 || (f.cal > 0 && f.p * 4 / f.cal >= 0.25);
    default: return true;
  }
}
function browserList(ctx){
  const slot = ctx.slot || slotByTime();
  if (ctx.q.trim()) return {items:searchFoods(ctx.q, slot).map(x => x.f), empty:'search'};
  switch (ctx.tab){
    case 'recent': return {items:recentFoods(40), empty:'recent'};
    case 'fav': return {items:state.favourites.map(findFood).filter(Boolean), empty:'fav'};
    case 'mine': return {items:state.customFoods.map(f => findFood(f.id)).filter(Boolean), empty:'mine'};
    case 'all': return {items:allFoods().filter(f => matchesFilter(f, ctx.filter)).sort((a, b) => (dietOk(b) - dietOk(a)) || (a.ord - b.ord)), empty:'none'};
    default: return {items:suggestions(slot, 30, selectedDate), empty:'none'};
  }
}

/* =========================================================
   NATURAL-LANGUAGE MEAL PARSER (runs on the device, works offline)
   ========================================================= */
const NUMW = {one:1, ek:1, 'एक':1, two:2, do:2, don:2, 'दो':2, 'दोन':2, three:3, teen:3, tin:3, 'तीन':3, four:4, char:4, chaar:4, 'चार':4,
  five:5, paanch:5, panch:5, pach:5, 'पांच':5, 'पाच':5, 'पाँच':5, six:6, chhe:6, saha:6, half:.5, aadha:.5, adha:.5, aadhi:.5, adhi:.5, ardha:.5, 'आधा':.5, 'आधी':.5, 'अर्धा':.5, 'अर्धी':.5,
  quarter:.25, pav:.25, dedh:1.5, 'डेढ़':1.5, 'दीड':1.5, dhai:2.5, 'ढाई':2.5, thoda:.5, thodi:.5, thodasa:.5, 'थोड़ा':.5, 'थोड़ी':.5, 'थोडा':.5, small:.5, chota:.5, choti:.5,
  big:1.5, large:1.5, bada:1.5, badi:1.5, double:2};
const UNITW = new Set(['katori','katoris','vati','bowl','bowls','plate','plates','glass','glasses','cup','cups','mug','piece','pieces','pc','pcs','slice','slices',
  'tbsp','tsp','spoon','spoons','serving','servings','x','nos','handful','scoop','scoops','वाटी','कटोरी','प्लेट','ग्लास','कप','पीस','तुकडा','तुकड़ा']);
const SLOTW = {breakfast:['breakfast','nashta','naashta','nasta','nashtyala','न्याहारी','नाश्ता','नाश्त्याला','सकाळी'],
  lunch:['lunch','dopahar','jevan','जेवण','दोपहर','दुपारी'], snacks:['snack','snacks','evening','shaam','sham','शाम','संध्याकाळी'], dinner:['dinner','raat','ratri','रात','रात्री','रात्रीच्या']};
const FILLER = new Set(['i','had','ate','have','eaten','for','in','at','the','some','my','me','today','khaya','khaye','khayi','khalla','khalle','mein','ko','la','मी','खाल्ले','खाया','खाई','में','को','मैंने']);
function parseMeal(text, defaultSlot){
  let slot = null;
  const chunks = String(text).toLowerCase().replace(/½/g, ' half ').replace(/¼/g, ' quarter ')
    .split(/,|;|\+|&|\n|\s(?:and|aur|ani|with|n|और|आणि|व|सोबत|साथ)\s/).map(s => s.trim()).filter(Boolean);
  const items = [], unmatched = [];
  const pick = (q, n) => {
    const res = searchFoods(q, slot || defaultSlot); if (!res.length) return null;
    const top = res.find(x => dietOk(x.f)) || res[0];
    // multi-word phrases must match well on every word; single words may be a near spelling
    if (n > 1 && top.match < n * 1.9) return null;
    return {f:top.f, low:top.match < n * 1.5 || !dietOk(top.f) || top !== res[0]};
  };
  for (const chunk of chunks){
    // split the chunk into groups: a quantity starts a new group, words follow it
    const groups = [{qty:1, sawQty:false, grams:null, words:[]}];
    const toks = chunk.split(/\s+/);
    const cur = () => groups[groups.length - 1];
    const setQty = v => { let g = cur(); if (g.words.length){ g = {qty:1, sawQty:false, grams:null, words:[]}; groups.push(g); } g.qty = (g.sawQty ? g.qty : 1) * v; g.sawQty = true; };
    for (let i = 0; i < toks.length; i++){
      const tk = toks[i].replace(/^x(?=\d)|(?<=\d)x$/g, '');
      const slotHit = Object.entries(SLOTW).find(([, ws]) => ws.includes(tk));
      if (slotHit){ slot = slotHit[0]; continue; }
      const gm = tk.match(/^(\d+(?:\.\d+)?)(g|gm|gms|grams?|ml)$/);
      if (gm){ setQty(1); cur().grams = Number(gm[1]); continue; }
      if (/^\d+(?:\.\d+)?$/.test(tk) && /^(g|gm|gms|grams?|ml)$/.test(toks[i + 1] || '')){ setQty(1); cur().grams = Number(tk); i++; continue; }
      if (/^\d+(?:\.\d+)?$/.test(tk)){ setQty(Number(tk)); continue; }
      if (/^\d+\/\d+$/.test(tk)){ const [a, b] = tk.split('/').map(Number); if (b) setQty(a / b); continue; }
      if (NUMW[tk] !== undefined){ setQty(NUMW[tk]); continue; }
      if (UNITW.has(tk) || FILLER.has(tk) || STOP.has(tk)) continue;
      cur().words.push(tk);
    }
    for (const g of groups){
      const w = g.words; let i = 0, first = true, lost = [];
      while (i < w.length){
        let hit = null, j;
        for (j = w.length; j > i; j--){ hit = pick(w.slice(i, j).join(' '), j - i); if (hit) break; }
        if (!hit){ lost.push(w[i]); i++; continue; }
        if (lost.length){ unmatched.push(lost.join(' ')); lost = []; }
        let qty = first ? g.qty : 1;
        if (first && g.grams && hit.f.grams) qty = g.grams / hit.f.grams;
        items.push({food:hit.f, qty:clamp(Math.round(qty * 4) / 4 || 0.25, 0.25, 20), text:w.slice(i, j).join(' '), low:hit.low});
        first = false; i = j;
      }
      if (lost.length) unmatched.push(lost.join(' '));
    }
  }
  return {slot, items, unmatched};
}

/* =========================================================
   LOGGING ACTIONS (all undoable)
   ========================================================= */
function logFoods(list, slot, date = selectedDate, quiet){
  const day = ensureDay(date), added = [];
  for (const {food, qty} of list){ const e = makeEntry(food, qty, date, slot); day.meals[slot].push(e); added.push(e.id); }
  const wasComplete = isComplete(date);
  save(); haptic();
  if (!quiet){
    const msg = list.length === 1 ? t('logged', {name:foodName(list[0].food)}) : t('loggedN', {n:list.length, slot:slotName(slot)});
    snack(msg, {label:t('undo'), fn:() => { const d = ensureDay(date); d.meals[slot] = d.meals[slot].filter(e => !added.includes(e.id)); save(); render(); if (sheet && sheet.kind === 'search') refreshSheet(); }});
  }
  afterLog(date, wasComplete);
  return added;
}
const isComplete = d => { const m = getDay(d).meals; return !!(m.breakfast.length && m.lunch.length && m.dinner.length); };
function afterLog(date){
  if (date === localDate() && isComplete(date) && state.celebrated !== date){
    state.celebrated = date + ':now'; persistQuiet();
    setTimeout(() => snack(t('day.completeSnack')), 3000);
  }
  const st = streakInfo();
  if ([3, 7, 14, 30, 60, 100, 365].includes(st.cur) && state.dismissed['ms' + st.cur] !== true){ state.dismissed['ms' + st.cur] = true; persistQuiet(); setTimeout(() => snack(t('streak.ms', {n:st.cur})), 3000); }
  checkAchievements();
}
function removeEntry(slot, id){
  const day = ensureDay(selectedDate), arr = day.meals[slot], i = arr.findIndex(x => x.id === id);
  if (i < 0) return;
  const [gone] = arr.splice(i, 1);
  save(); haptic(); render();
  snack(t('removed', {name:entryName(gone)}), {label:t('undo'), fn:() => { ensureDay(selectedDate).meals[slot].splice(i, 0, gone); save(); render(); }});
}
function addWater(dir){
  const d = ensureDay(selectedDate), ml = state.settings.glassMl, before = d.water;
  d.water = Math.max(0, d.water + dir * ml);
  if (d.water === before) return;
  save(); haptic(); render();
  if (sheet && sheet.kind === 'quick') refreshSheet();
  snack(t(dir > 0 ? 'water.added' : 'water.removed', {ml}), {label:t('undo'), fn:() => { ensureDay(selectedDate).water = before; save(); render(); }});
}

const dlg = $('#sheet');

/* drag the grip down to dismiss */
let drag = null;
dlg.addEventListener('pointerdown', e => {
  if (!e.target.closest('[data-grip]')) return;
  const inner = $('.sheet-in', dlg); drag = {y:e.clientY, inner, dy:0};
  inner.style.transition = 'none'; e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
});
dlg.addEventListener('pointermove', e => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y); drag.inner.style.transform = `translateY(${drag.dy}px)`; });
const endDrag = () => { if (!drag) return; const {inner, dy} = drag; drag = null; inner.style.transition = ''; if (dy > 110) closeSheet(); else inner.style.transform = ''; };
dlg.addEventListener('pointerup', endDrag); dlg.addEventListener('pointercancel', endDrag);

  if (dates.length < 2) return `<p class="empty">${t('tr.wNeed')}</p>`;
  const W = 340, H = 170, L = 40, R = 14, T = 14, B = 26;
  const vals = dates.map(d => wOut(state.weights[d])), av = avgs.map(wOut);
  let lo = Math.min(...vals, ...av), hi = Math.max(...vals, ...av);
  if (hi - lo < 1){ const mid = (hi + lo) / 2; lo = mid - 0.5; hi = mid + 0.5; }
  lo = Math.floor((lo - 0.2) * 2) / 2; hi = Math.ceil((hi + 0.2) * 2) / 2;
  const t0 = parseDate(dates[0]).getTime(), t1 = parseDate(dates[dates.length - 1]).getTime(), span = Math.max(1, t1 - t0);
  const x = d => L + (parseDate(d).getTime() - t0) / span * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const line = dates.map((d, i) => (i ? 'L' : 'M') + x(d).toFixed(1) + ' ' + y(av[i]).toFixed(1)).join(' ');
  const ticks = [lo, (lo + hi) / 2, hi], lx = x(dates[dates.length - 1]), ly = y(av[av.length - 1]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('tr.wTitle'))}: ${r1(av[0])} → ${r1(av[av.length - 1])} ${wUnit()}">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--border-subtle)" stroke-width="1"/><text x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`).join('')}
    ${dates.map((d, i) => `<circle cx="${x(d).toFixed(1)}" cy="${y(vals[i]).toFixed(1)}" r="2.6" fill="var(--text-2)" fill-opacity=".55"/>`).join('')}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="var(--bg-surface)" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${L}" y="${H - 6}" text-anchor="start">${esc(fmtShort(dates[0]))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fmtShort(dates[dates.length - 1]))}</text>
  </svg>`;
}

function readGoalsForm(){
  const P = {...state.profile}, f = $('#goalsForm'); if (!f) return P;
  $$('[data-p]', f).forEach(el => {
    const k = el.dataset.p, v = el.value.trim();
    if (k === 'name' || k === 'sex' || k === 'goal'){ P[k] = v; return; }
    const n = parseFloat(v); if (!(n >= 0)) return;
    if (k === 'weight'){ const kg = wIn(n); if (kg >= 25 && kg <= 250) P.weight = r1(kg); }
    else if (k === 'height'){ if (n >= 100 && n <= 230) P.height = Math.round(n); }
    else if (k === 'ft' || k === 'in'){ const ft = parseFloat($('#p-ft').value) || 0, inch = parseFloat($('#p-in').value) || 0, cm = (ft * 12 + inch) * 2.54; if (cm >= 100 && cm <= 230) P.height = Math.round(cm); }
    else if (k === 'age'){ if (n >= 13 && n <= 100) P.age = Math.round(n); }
    else if (k === 'activity' || k === 'pace') P[k] = n;
    else if (n > 0) P[k] = Math.round(n);
  });
  return P;
}
function updateCalcNote(){
  const P = readGoalsForm(), bmr = calcBMR(P), tdee = Math.round(bmr * P.activity), bmi = calcBMI(P);
  const note = $('#calcNote'); if (!note) return;
  note.innerHTML = t('me.numbers', {bmi:bmi.toFixed(1), cat:t('bmi.' + bmiCat(bmi)), bmr:fmtN(bmr), tdee:fmtN(tdee)});
  const m = Math.round(P.goalProtein * 4 + P.goalCarbs * 4 + P.goalFat * 9), d = m - P.goalCalories;
  $('#macroCheck').innerHTML = Math.abs(d) > P.goalCalories * 0.05
    ? `<div class="banner"><span>${t('me.macroWarn', {m:fmtN(m), d:fmtN(Math.abs(d)), dir:t(d > 0 ? 'me.above' : 'me.below')})}</span><button type="button" class="btn" data-act="fix-carbs">${t('me.fixCarbs')}</button></div>`
    : `<p class="muted" style="font-size:.875rem">${ic('check', 14)} ${t('me.macroOk', {m:fmtN(m)})}</p>`;
}
function flashSaved(){ const s = $('#savedTag'); if (!s) return; s.classList.add('show'); clearTimeout(flashSaved._t); flashSaved._t = setTimeout(() => s.classList.remove('show'), 1600); }
function onGoalsChange(el){
  const before = {...state.profile};
  state.profile = readGoalsForm();
  if (el && el.hasAttribute('data-body')){
    Object.assign(state.profile, suggestTargets(state.profile));
    const activeId = document.activeElement && document.activeElement.id;
    save(); renderMe(); flashSaved();
    const changed = ['goalCalories','goalProtein','goalWater'].some(k => before[k] !== state.profile[k]);
    if (changed) snack(t('me.recalced'), {label:t('undo'), fn:() => { state.profile = before; save(); renderMe(); }});
    const f = activeId && document.getElementById(activeId); if (f) f.focus();
  } else { save(); updateCalcNote(); flashSaved(); }
}
function setInstallText(){
  const el = $('#installText'); if (!el) return;

const ob = {step:0, d:null};

  const P = state.profile;
  ob.step = 0; ob.d = {goal:P.goal === 'maintain' && !state.onboarded ? '' : P.goal, sex:P.sex, age:P.age, weight:P.weight, height:P.height, activity:P.activity, pace:P.pace,
    diet:state.settings.diet === 'nonveg' && !state.onboarded ? '' : state.settings.diet, regions:[...state.settings.regions]};
  $('#onboard').hidden = false; document.body.style.overflow = 'hidden'; $('.app').inert = true;
  renderOnboarding();
  setTimeout(() => { const h = $('#obTitle'); if (h) h.focus(); }, 30);
}
function finishOnboarding(goLog){
  const d = ob.d, wasSample = state.sample;
  if (wasSample){ const keep = {...state.settings}; state = normalizeState({settings:keep}); reindex(); }
  Object.assign(state.profile, {goal:d.goal || 'maintain', sex:d.sex, age:d.age, weight:d.weight, height:d.height, activity:d.activity, pace:d.pace});
  Object.assign(state.profile, suggestTargets(state.profile));
  state.settings.diet = d.diet || 'nonveg'; state.settings.regions = d.regions;
  state.onboarded = true; state.sample = false; delete state.dismissed.whatsNewPending;
  save();
  closeOnboarding();
  setView('today');
  if (goLog) setTimeout(() => openSheet('quick', {slot:slotByTime()}), 120);
}
